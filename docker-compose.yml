services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      # Ảnh lễ cưới tải về server (xem public/wedding/photos.json)
      - ${WEDDING_PHOTOS_DIR:-./photos}:/photos:ro
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:4.4
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
